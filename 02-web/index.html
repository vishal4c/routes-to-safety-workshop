<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Routes to Safety — evacuation map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Placeholder page for Module 2 (render) + Module 3 (route overlay).
       MapLibre GL JS + PMTiles, served from any static file server — no tile server.
       Pin exact library versions before the session (see ../.tool-versions). -->
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #panel { position: absolute; top: 10px; left: 10px; z-index: 1;
             background: #fff; padding: 8px 10px; font: 13px system-ui; border-radius: 6px;
             box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 260px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <strong>Routes to Safety</strong><br />
    Placeholder map. Loads <code>basemap.pmtiles</code>, then Module 3 adds
    draggable start/end markers and the OSRM evacuation route.
  </div>

  <script>
    // Register the pmtiles:// protocol so MapLibre reads a single PMTiles file over HTTP range requests.
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    const map = new maplibregl.Map({
      container: 'map',
      center: [-121.4944, 38.5816],   // Sacramento (placeholder)
      zoom: 11,
      style: './style.json'           // basemap style; see style.json (placeholder)
    });

    map.on('load', () => {
      // TODO (Module 2): add/restyle the hazard + water layers.
      // TODO (Module 3): add the OSRM route as a GeoJSON line + draggable start/end markers,
      //                  with a popup showing travel time. See ../03-routing/route-demo.js.
    });
  </script>
</body>
</html>
