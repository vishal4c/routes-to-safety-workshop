name: devcontainer-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.devcontainer/**', 'versions.env', '.github/workflows/devcontainer-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the Dockerfile directly: `devcontainer build` rejects --platform/--push for
      # docker-compose based devcontainers, and this image is just the tool layer (no data).
      - name: Read pins from versions.env
        id: pins
        run: |
          set -a; . ./versions.env; set +a
          {
            echo "DUCKDB_VERSION=$DUCKDB_VERSION"
            echo "PMTILES_VERSION=$PMTILES_VERSION"
            echo "PLANETILER_VERSION=$PLANETILER_VERSION"
            echo "NODE_VERSION=$NODE_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vishal4c/routes-to-safety-workshop:latest
            ghcr.io/vishal4c/routes-to-safety-workshop:${{ github.sha }}
          build-args: |
            DUCKDB_VERSION=${{ steps.pins.outputs.DUCKDB_VERSION }}
            PMTILES_VERSION=${{ steps.pins.outputs.PMTILES_VERSION }}
            PLANETILER_VERSION=${{ steps.pins.outputs.PLANETILER_VERSION }}
            NODE_VERSION=${{ steps.pins.outputs.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# This image is the "workshop" service only (tools, no data). Codespaces pulls it through
# docker-compose.yml (no build at codespace creation); the ghcr package must stay public.
# Optional: enable a Codespaces prebuild (repo Settings → Codespaces → Prebuilds) on main.
