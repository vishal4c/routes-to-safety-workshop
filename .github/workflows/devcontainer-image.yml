name: devcontainer-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.devcontainer/**', 'versions.env', 'docker-compose.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/vishal4c/routes-to-safety-workshop
          imageTag: latest,${{ github.sha }}
          push: always
          platform: linux/amd64,linux/arm64
# Prebuild note: this image is the "workshop" service only (tools, no data). To make Codespaces
# start fast, enable a Codespaces prebuild (repo Settings → Codespaces → Prebuilds) on main, or
# switch the workshop service in .devcontainer/docker-compose.yml from `build:` to
# `image: ghcr.io/vishal4c/routes-to-safety-workshop:latest`. Make the ghcr package public.
