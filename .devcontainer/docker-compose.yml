# Overlay on ../docker-compose.yml (osrm + caddy). Adds the "workshop" shell container.
# The repo is bind-mounted at the SAME path in workshop and caddy, so files written in
# the terminal (out/evac.pmtiles, out/*.geojson) are served by Caddy immediately.
services:
  workshop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DUCKDB_VERSION: ${DUCKDB_VERSION:-2.0.0}
        JAVA_VERSION: ${JAVA_VERSION:-21}
        NODE_VERSION: ${NODE_VERSION:-22}
        PMTILES_VERSION: ${PMTILES_VERSION:-1.31.2}
        PLANETILER_VERSION: ${PLANETILER_VERSION:-0.10.2}
        OSMIUM_VERSION: ${OSMIUM_VERSION:-1.19}
    volumes:
      - ..:/workspaces/routes-to-safety-workshop:cached
    command: sleep infinity
    environment:
      BUNDLE_TAG: ${BUNDLE_TAG:-data-v1}

  caddy:
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ..:/workspaces/routes-to-safety-workshop:ro
