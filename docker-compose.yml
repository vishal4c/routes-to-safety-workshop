# Tier 2 — local containers.  Works with:  docker compose up | finch compose up | podman compose up
#
# Why image names have inline defaults instead of reading versions.env:
#   Compose only interpolates ${VAR} from the shell or from a file called ".env".
#   versions.env is the single source of truth, so rather than generating a second copy (.env) we
#   repeat the value as a ${VAR:-default} and let scripts/check-versions.sh fail CI if the default
#   ever differs from versions.env.  Override at run time:  OSRM_IMAGE=... docker compose up
#
# OSRM is NOT published to the host: it is reached through Caddy at http://localhost:8080/osrm/...
# Needs data/osrm/study-area.osrm.*  (run scripts/get-bundle.sh, or scripts/build-osrm.sh).
#
# Three services:
#   workshop  the tool image (DuckDB + spatial, Temurin 21, Planetiler, go-pmtiles, Node 22, osmium, uv) with the
#             repo bind-mounted — `docker compose exec workshop bash` and every workshop command runs unchanged.
#             Pulled from ghcr.io (multi-arch); the Codespaces overlay in .devcontainer/ builds the same Dockerfile.
#   osrm      the routing engine, reads data/osrm/study-area.osrm.*
#   caddy     static files for the repo on :8080 (Range requests → PMTiles works) + /osrm/* proxy
services:
  workshop:
    image: ${WORKSHOP_IMAGE:-ghcr.io/vishal4c/routes-to-safety-workshop:latest}
    volumes:
      - .:/workspaces/routes-to-safety-workshop:cached
    working_dir: /workspaces/routes-to-safety-workshop
    command: sleep infinity
    environment:
      BUNDLE_TAG: ${BUNDLE_TAG:-data-v1}
      OSRM_URL: http://caddy:8080/osrm
      WEB_URL: http://caddy:8080
      WORKSHOP_CONTAINER: "1"
    init: true

  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.10.0-debian}
    # Waits for the graph: a fresh clone has no data/osrm until scripts/get-bundle.sh runs, so
    # `docker compose up -d` may legitimately come first. No restart loop, no red OSRM line.
    command:
      - sh
      - -c
      - until [ -f /data/study-area.osrm.mldgr ]; do echo "osrm waiting for data/osrm - run scripts/get-bundle.sh"; sleep 3; done; exec osrm-routed --algorithm mld --max-table-size 500 /data/study-area.osrm
    volumes:
      - ./data/osrm:/data:ro
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/srv:ro
    depends_on:
      - osrm
    restart: unless-stopped
